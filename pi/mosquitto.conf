# Mosquitto config for the Pi gateway: accept connections from the laptop over Wi-Fi.
# Install: sudo cp pi/mosquitto.conf /etc/mosquitto/conf.d/iot.conf && sudo systemctl restart mosquitto
listener 1883 0.0.0.0
# shortcut: anonymous access is fine on an isolated lab network; add password_file + acl_file before using a shared network.
allow_anonymous true
